<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Key symbol (stylized key icon) -->
  <g transform="translate(100, 140)">
    <circle cx="30" cy="30" r="28" fill="white" opacity="0.95"/>
    <circle cx="30" cy="30" r="18" fill="none" stroke="#1E40AF" stroke-width="4"/>
    <rect x="42" y="26" width="60" height="8" rx="4" fill="white" opacity="0.95"/>
    <rect x="90" y="16" width="8" height="12" rx="2" fill="white" opacity="0.95"/>
    <rect x="90" y="32" width="8" height="12" rx="2" fill="white" opacity="0.95"/>
  </g>
  
  <!-- Length symbol (ruler/measure) -->
  <g transform="translate(130, 250)">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="white" opacity="0.95"/>
    <line x1="20" y1="0" x2="20" y2="40" stroke="#1E40AF" stroke-width="3"/>
    <line x1="40" y1="10" x2="40" y2="30" stroke="#1E40AF" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="40" stroke="#1E40AF" stroke-width="3"/>
    <line x1="80" y1="10" x2="80" y2="30" stroke="#1E40AF" stroke-width="2"/>
    <line x1="100" y1="0" x2="100" y2="40" stroke="#1E40AF" stroke-width="3"/>
  </g>
  
  <!-- Value symbol (data blocks) -->
  <g transform="translate(280, 340)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="white" opacity="0.95"/>
    <rect x="60" y="0" width="50" height="50" rx="6" fill="white" opacity="0.95"/>
    <rect x="120" y="0" width="50" height="50" rx="6" fill="white" opacity="0.95"/>
    <!-- Binary dots pattern inside blocks -->
    <circle cx="25" cy="20" r="4" fill="#1E40AF"/>
    <circle cx="25" cy="30" r="4" fill="#1E40AF"/>
    <circle cx="85" cy="20" r="4" fill="#3B82F6"/>
    <circle cx="85" cy="30" r="4" fill="#1E40AF"/>
    <circle cx="145" cy="20" r="4" fill="#1E40AF"/>
    <circle cx="145" cy="30" r="4" fill="#3B82F6"/>
  </g>
  
  <!-- Connecting flow lines -->
  <path d="M 130 170 Q 180 200 160 250" stroke="url(#accentGradient)" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 200 290 Q 240 310 305 340" stroke="url(#accentGradient)" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
  
  <!-- KLV Text -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">KLV</text>
</svg>
